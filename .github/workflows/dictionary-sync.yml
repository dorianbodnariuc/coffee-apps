name: Dictionary sync

# Syncs the app glossary DIRECTLY from coffee-dictionary.com (the site is the
# storage; public HTML is the API). No seo-app dependency.
#  1. scrape sitemap + term pages → glossary snapshot
#  2. generate an idempotent upsert migration when the term set changed
#  3. open a PR; merging applies it to Supabase (supabase-migrate.yml)
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dictionary-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync from coffee-dictionary.com
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/dictionary/sync_from_site.py

      - name: Detect change
        id: change
        run: |
          git status --porcelain | grep -q . && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="dictionary-sync/${DATE}"
          git config user.name "dictionary-sync-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add data/dictionary supabase/migrations
          git commit -m "chore(dictionary): site sync ${DATE} — from coffee-dictionary.com"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "Dictionary sync ${DATE} (site)" \
            --body "Automated sync scraped from coffee-dictionary.com (sitemap + term pages). Review the migration diff, then merge to deploy to Supabase (merge triggers supabase-migrate.yml)." \
            --base main --head "$BRANCH")
          echo "PR opened: ${PR_URL}"
