name: Dictionary proposals export

# Weekly: exports new glossary term proposals (submitted by app users via the
# glossary_proposals table) to an issue on seo-app-v2, where dictionary work
# happens. Proposals older than 90 days are closed as expired automatically.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export pending proposals to seo-app-v2 issue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SEO_APP_ISSUE_TOKEN: ${{ secrets.SEO_APP_ISSUE_TOKEN }}
        run: python3 scripts/dictionary/export_proposals_to_issue.py
