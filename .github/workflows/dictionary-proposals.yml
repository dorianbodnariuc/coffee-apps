name: Dictionary proposals export

# Weekly: exports new glossary term proposals (submitted by app users via the
# glossary_proposals table) to an issue in THIS repo. The dictionary reviewer
# publishes accepted terms on coffee-dictionary.com; the daily site-sync
# workflow then brings them into the app automatically.
#
# Uses a direct DB connection (SUPABASE_DB_URL) — there is intentionally no
# anon-readable export path on the proposals table (see migration
# 20260906_glossary_proposals_lockdown.sql).
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export pending proposals to an issue
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet "psycopg[binary]"
          python3 scripts/dictionary/export_proposals_to_issue.py
