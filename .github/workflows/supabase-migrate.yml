name: Supabase migrate

# Applies pending supabase/migrations to the live database when they land on
# main (including merges of dictionary-sync PRs). Uses a direct connection
# string, so no Supabase project link is needed on CI.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Retry only transient (connection) failures. A SQLSTATE error is
          # deterministic — retrying just burns minutes and fails identically.
          n=0
          while true; do
            if out=$(supabase db push --db-url "$SUPABASE_DB_URL" 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"
            if echo "$out" | grep -q "SQLSTATE"; then
              echo "Deterministic SQL error — not retrying."
              exit 1
            fi
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "db push failed after 3 attempts"; exit 1; fi
            echo "retry #$n after transient failure…"
            sleep 20
          done

      - name: Verify glossary count
        if: always()
        run: |
          echo "Migration job finished (see db push step for result)."
